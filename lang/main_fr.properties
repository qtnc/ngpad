/clear: effacer la conversation\
/model: lister les modèles disponibles\
/model <nom>: changer de modèle\
/undo: annuler le dernier échange (votre message et la réponse)\
/retry: annuler le dernier échange et renvoyer le même message\
/save: enregistrer la conversation\
/title <titre>: changer le titre de la fenêtre (sans titre: revenir au titre par défaut)\
/tokens: afficher le nombre de tokens utilisés depuis le début de la conversation\
/help: afficher cette aide\
Raccourcis: Shift+Entrée pour envoyer, Ctrl+Haut/Bas pour aller au message précédent/suivant (avec Shift pour sélectionner), Shift+Échap pour annuler la requête en cours, Ctrl+M pour choisir le modèle, Ctrl+Shift+L pour effacer la conversation, Ctrl+S pour l'enregistrer, Ctrl+Shift+S pour l'enregistrer sous un autre nom, Ctrl+O pour ouvrir une conversation enregistrée. La conversation est aussi enregistrée automatiquement après chaque échange. Les autres actions sont dans le menu contextuel.
